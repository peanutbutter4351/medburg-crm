services:
  web:
    build: .
    container_name: medburg_web

    command: >
      sh -c "
      python manage.py migrate &&
      gunicorn medburg_crm.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - .:/app

    ports:
      - "8000:8000"

    env_file:
      - .env
      - .env.prod

    depends_on:
      - db

  db:
    image: postgres:16
    container_name: medburg_db

    volumes:
      - postgres_data:/var/lib/postgresql/data/

    environment:
      POSTGRES_DB: medburg_db
      POSTGRES_USER: medburg_user
      POSTGRES_PASSWORD: medburg_password

volumes:
  postgres_data: