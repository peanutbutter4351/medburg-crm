# ─────────────────────────────────────────────────────────────────────────────
# Medburg CRM — Nginx Virtual Host Configuration
# File: deploy/nginx/medburg_crm.conf
#
# Install on VPS:
#   sudo cp deploy/nginx/medburg_crm.conf /etc/nginx/sites-available/medburg_crm
#   sudo ln -sf /etc/nginx/sites-available/medburg_crm \
#               /etc/nginx/sites-enabled/medburg_crm
#   sudo nginx -t && sudo systemctl reload nginx
#
# After Certbot SSL (Phase 2A-6):
#   sudo certbot --nginx -d medburgmedical.com -d www.medburgmedical.com
#   (Certbot will append SSL server block — do NOT modify the HTTP block)
#
# Architecture:
#   Client → Nginx (port 80) → Unix socket → Gunicorn → Django
#                           └→ /static/   (served directly, zero Django overhead)
#                           └→ /media/    (served directly, zero Django overhead)
#
# Multi-domain strategy:
#   This file handles medburgmedical.com only.
#   Lordtip CRM will have a separate file: deploy/nginx/lordtip_crm.conf
#   Both share /run/gunicorn/ via different socket names.
# ─────────────────────────────────────────────────────────────────────────────

# ── Global Nginx tuning (add to /etc/nginx/nginx.conf if not already present) ──
# These are reminders — they go in nginx.conf, not here:
#   worker_processes auto;
#   worker_connections 1024;
#   keepalive_timeout 65;
#   gzip on; gzip_types text/plain text/css application/json application/javascript ...

# ── Upstream — Gunicorn via Unix socket ───────────────────────────────────────
# WHY Unix socket over TCP 127.0.0.1:8000:
#   - No TCP stack overhead (no SYN/ACK, no TIME_WAIT accumulation)
#   - Only Nginx (same server, group=www-data) can connect — not exposed
#   - ~15% faster than TCP loopback for short-lived Django requests
#   - Socket lives in /run/gunicorn/ (tmpfs), cleaned up by RuntimeDirectory=
upstream medburg_gunicorn {
    # fail_timeout=0: keep trying even if Gunicorn returns errors.
    # systemd's Restart=on-abnormal will revive Gunicorn; Nginx reconnects.
    server unix:/run/gunicorn/medburg.sock fail_timeout=0;

    # Keepalive: reuse connections to Gunicorn instead of opening a new socket
    # per request. Must be paired with proxy_http_version 1.1 below.
    # Value = max idle connections kept alive in the pool (not max concurrent).
    keepalive 32;
}

# ── Catch-all: reject direct IP access and unmatched hostnames ────────────────
# WHY: Without this, a direct request to the VPS IP would match the first
# server block and serve the CRM — exposing it before DNS is properly set up.
# Also prevents scanners from fingerprinting the app via IP.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 444 = Nginx-specific code: close connection immediately, no response.
    return 444;
}

# ── HTTP server block — medburgmedical.com ────────────────────────────────────
# Phase 2A-5: HTTP only. Certbot will insert the SSL server block when run.
# Do NOT add the HTTPS redirect here yet — it will be done by Certbot.
server {
    listen 80;
    listen [::]:80;

    # Real domain — include www for redirect handling pre and post SSL
    server_name medburgmedical.com www.medburgmedical.com;

    # ── Logging ───────────────────────────────────────────────────────────────
    # Structured format with request ID for cross-referencing with Django logs.
    # Add this to /etc/nginx/nginx.conf log_format section:
    #   log_format medburg_main '$remote_addr - $remote_user [$time_local] '
    #       '"$request" $status $body_bytes_sent '
    #       '"$http_referer" "$http_user_agent" '
    #       'rt=$request_time ut="$upstream_response_time" '
    #       'rid=$request_id';
    # Then use: access_log /var/log/nginx/medburg_access.log medburg_main;
    # For now, default combined format:
    access_log /var/log/nginx/medburg_access.log;
    error_log  /var/log/nginx/medburg_error.log warn;

    # ── Upload size ───────────────────────────────────────────────────────────
    # 50M: headroom for future CSV/Excel medicine import files.
    # Django's DATA_UPLOAD_MAX_MEMORY_SIZE must also allow this.
    # The current CRM has no uploads — but set headroom now to avoid
    # 413 Request Entity Too Large when CSV imports are added.
    client_max_body_size 50M;

    # ── Connection settings ───────────────────────────────────────────────────
    # Match Gunicorn's keepalive = 5s setting in gunicorn.conf.py.
    # Nginx will hold idle keep-alive connections open for this long.
    keepalive_timeout 5;

    # ── Gzip compression ──────────────────────────────────────────────────────
    # WHY: WhiteNoise pre-compresses static files (.br, .gz) but Gunicorn's
    # dynamic responses (HTML, JSON) are uncompressed. Nginx handles that here.
    # Static files: already compressed by WhiteNoise — gzip_static handles them.
    # Dynamic: gzip on-the-fly for HTML/JSON responses from Gunicorn.
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 5;          # balanced speed vs ratio (1=fastest, 9=best)
    gzip_min_length 256;        # don't bother compressing tiny responses
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Production security headers ───────────────────────────────────────────
    # These supplement Django's SecurityMiddleware headers.
    # Django sets: X-Frame-Options, X-Content-Type-Options, Referrer-Policy.
    # Nginx adds: CSP, Permissions-Policy, and HTTPS-ready headers.
    #
    # X-Frame-Options: Django sets DENY via X_FRAME_OPTIONS setting.
    # We don't duplicate here to avoid duplicate header issues.
    #
    # Referrer-Policy: Control referrer exposure (important for medical CRM).
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Permissions-Policy: disable browser features the CRM doesn't need.
    # Prevents rogue JS (e.g. from XSS) from accessing camera, mic, location.
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Content-Security-Policy (Phase 2A-5 baseline — relaxed, no 'unsafe-inline' removal yet)
    # WARNING: A strict CSP that blocks inline scripts will break Django admin.
    # This CSP allows same-origin scripts and inline styles (Django admin needs these).
    # Tighten after auditing all inline scripts in templates.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'none';" always;

    # NOTE: HSTS header is NOT added here.
    # It will be added by Certbot when SSL is installed.
    # Do NOT add it manually — see production.py HSTS rollout comment.

    # ── Static files — served directly by Nginx ───────────────────────────────
    # WhiteNoise also serves static files via Gunicorn, but Nginx is faster:
    # Nginx serves from disk; Gunicorn would spend a Python callframe per request.
    # For a CRM, the difference is minor — but Nginx static serving is free.
    #
    # expires 1y + immutable: tells browsers to cache forever and NEVER recheck.
    # This is safe because WhiteNoise's CompressedManifestStaticFilesStorage
    # generates content-hashed filenames (e.g. main.a3f7c91.css). When CSS
    # changes, a new filename is generated — old cached files are never stale.
    location /static/ {
        alias /var/www/medburg_crm/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;         # silence high-volume static file log noise
        log_not_found off;      # suppress 404s for missing static assets
    }

    # ── Media files — served directly by Nginx ────────────────────────────────
    # User-uploaded files (future: CSV imports, avatars, export files).
    # Gunicorn never handles /media/ requests — zero application overhead.
    #
    # expires 7d: media files may change (e.g. re-upload same filename).
    # Do NOT use 1y/immutable here — media filenames are not content-hashed.
    #
    # SECURITY NOTE: These files are currently PUBLIC (no auth check).
    # If/when confidential file uploads are added, replace this block with
    # an X-Accel-Redirect pattern where Django authenticates, then sends:
    #   response['X-Accel-Redirect'] = '/protected-media/filename.csv'
    # and Nginx serves from an 'internal' location. See docs for details.
    location /media/ {
        alias /var/www/medburg_crm/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # ── Django application — proxy to Gunicorn ────────────────────────────────
    location / {
        proxy_pass http://medburg_gunicorn;

        # ── HTTP version ──────────────────────────────────────────────────────
        # WHY 1.1 (not default 1.0):
        #   HTTP/1.0 sends "Connection: close" after each request, forcing a
        #   new socket open per request — negating the upstream keepalive pool.
        #   HTTP/1.1 supports persistent connections (keep-alive).
        proxy_http_version 1.1;

        # Clear the Connection header so upstream keepalive pool works.
        # (HTTP/1.1 defaults Connection: keep-alive, but proxies may pass
        #  hop-by-hop headers — clearing it ensures clean upstream reuse.)
        proxy_set_header Connection "";

        # ── Real client headers ───────────────────────────────────────────────
        # Host: Django uses this for ALLOWED_HOSTS validation and URL building.
        proxy_set_header Host              $host;

        # X-Real-IP: single client IP (last hop). Used by Django's
        # request.META['REMOTE_ADDR'] when SECURE_PROXY_SSL_HEADER is set.
        proxy_set_header X-Real-IP         $remote_addr;

        # X-Forwarded-For: full proxy chain. Use for logging, not auth.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # X-Forwarded-Proto: tells Django the original scheme (http/https).
        # Django's SECURE_PROXY_SSL_HEADER trusts this to set request.is_secure().
        # SECURITY: Nginx strips client-supplied X-Forwarded-Proto before adding
        # its own — no spoofing possible from external clients.
        proxy_set_header X-Forwarded-Proto $scheme;

        # X-Request-ID: correlate Nginx access log with Django app log.
        # $request_id is available in Nginx 1.11.0+ (Ubuntu 24.04 ships 1.24).
        proxy_set_header X-Request-ID      $request_id;

        # ── Timeouts ─────────────────────────────────────────────────────────
        # Match Gunicorn's timeout=30s in gunicorn.conf.py.
        # If Gunicorn takes longer than this, Nginx returns 504 to the client.
        # Increase to 120s if heavy CSV import views are added.
        proxy_connect_timeout 30s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # ── Response buffering ────────────────────────────────────────────────
        # WHY larger buffers (vs 8k default):
        #   Django admin responses include session cookies, CSRF tokens, and
        #   potentially large HTML. If the response header doesn't fit in the
        #   buffer, Nginx spools to a temp file (I/O hit) or fails.
        #   16k covers Django admin response headers comfortably.
        proxy_buffering      on;
        proxy_buffer_size    16k;
        proxy_buffers        8 16k;
        proxy_busy_buffers_size 32k;

        # Don't rewrite Location headers returned by Django (let Django manage them)
        proxy_redirect off;
    }

    # ── Deny hidden files — critical security rule ────────────────────────────
    # Blocks direct access to .env, .git/config, .htaccess, etc.
    # This must come BEFORE the location / block in evaluation order (it doesn't
    # in Nginx — regex locations take priority over prefix locations).
    # Nginx evaluates: exact (=) → regex (~, ~*) → prefix (/) in that order.
    # So this regex block runs before location /.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # ── Favicon ───────────────────────────────────────────────────────────────
    # Serve directly from staticfiles — avoid Gunicorn for this noisy request.
    location = /favicon.ico {
        alias /var/www/medburg_crm/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ── robots.txt ────────────────────────────────────────────────────────────
    location = /robots.txt {
        alias /var/www/medburg_crm/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }

    # ── Custom error pages (optional — create these templates if desired) ─────
    # error_page 500 502 503 504 /50x.html;
    # location = /50x.html {
    #     root /var/www/medburg_crm/staticfiles/errors/;
    #     internal;
    # }
}

# ═══════════════════════════════════════════════════════════════════════════════
# HTTPS SERVER BLOCK — added by Certbot (Phase 2A-6)
# ═══════════════════════════════════════════════════════════════════════════════
# After running: sudo certbot --nginx -d medburgmedical.com -d www.medburgmedical.com
#
# Certbot will automatically:
#   1. Add `listen 443 ssl;` to this file or create a new server block
#   2. Add `ssl_certificate` / `ssl_certificate_key` directives
#   3. Optionally add the HTTP→HTTPS redirect (301) in the port 80 block
#
# After Certbot succeeds, manually add these to the 443 block:
#   add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
#   (start with max-age=300, graduate to 31536000 over weeks)
#
# Then flip in .env.prod (in order):
#   DJANGO_SECURE_SSL_REDIRECT=True
#   DJANGO_SESSION_COOKIE_SECURE=True
#   DJANGO_CSRF_COOKIE_SECURE=True
#   DJANGO_HSTS_SECONDS=300
#   (and restart Gunicorn: sudo systemctl restart medburg)
# ═══════════════════════════════════════════════════════════════════════════════
