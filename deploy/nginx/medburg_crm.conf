# ─────────────────────────────────────────────────────────────────────────────
# Medburg CRM — Nginx Virtual Host Configuration
# File: deploy/nginx/medburg_crm.conf
#
# Install on VPS:
#   sudo cp deploy/nginx/medburg_crm.conf /etc/nginx/sites-available/medburg_crm
#   sudo ln -sf /etc/nginx/sites-available/medburg_crm \
#               /etc/nginx/sites-enabled/medburg_crm
#   sudo nginx -t && sudo systemctl reload nginx
#
# After Certbot SSL:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com
#   (Certbot will auto-modify this file to add SSL blocks)
#
# Architecture:
#   Client → Nginx (port 80/443) → Unix socket → Gunicorn → Django
#                                └──────────────────────────────────→ /static/
#                                └──────────────────────────────────→ /media/
# ─────────────────────────────────────────────────────────────────────────────

# Upstream block — references the Gunicorn Unix socket
# Benefits of Unix socket over TCP 127.0.0.1:8000:
#   - No TCP stack overhead (no SYN/ACK, no TIME_WAIT accumulation)
#   - Not exposed even on loopback (pure filesystem permission model)
#   - ~15% faster on loopback-equivalent workloads
upstream medburg_gunicorn {
    # fail_timeout=0 means Nginx keeps trying even after Gunicorn errors
    # (systemd will restart Gunicorn; Nginx will reconnect automatically)
    server unix:/run/gunicorn/medburg.sock fail_timeout=0;
}

# ── HTTP → HTTPS redirect (pre-Certbot: remove this block initially) ──────────
# Uncomment after Certbot is installed and SSL is confirmed working.
# Certbot may add its own redirect — only one redirect block is needed.
#
# server {
#     listen 80;
#     listen [::]:80;
#     server_name yourdomain.com www.yourdomain.com;
#     return 301 https://$host$request_uri;
# }

# ── Main server block ─────────────────────────────────────────────────────────
server {
    # Initial setup: HTTP only. Certbot will add SSL lines below this.
    listen 80;
    listen [::]:80;

    # Replace with your actual domain name or VPS IP during initial setup
    server_name yourdomain.com www.yourdomain.com;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/medburg_access.log;
    error_log  /var/log/nginx/medburg_error.log warn;

    # ── Upload size limit ─────────────────────────────────────────────────────
    # Match or exceed Django's DATA_UPLOAD_MAX_MEMORY_SIZE
    # Increase to 50M or more when CSV/Excel import is added
    client_max_body_size 20M;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    # Match Gunicorn's keepalive setting
    keepalive_timeout 5;

    # ── Static files — served directly by Nginx ───────────────────────────────
    # collectstatic output — WhiteNoise also handles this, but Nginx is faster
    # for very high traffic. For low-traffic CRM, WhiteNoise alone is fine.
    location /static/ {
        alias /var/www/medburg_crm/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        access_log off;  # Silence static file log noise
    }

    # ── Media files — served directly by Nginx ────────────────────────────────
    # User-uploaded files (future: CSVs, avatars, exports)
    # Gunicorn never handles these — zero application overhead
    location /media/ {
        alias /var/www/medburg_crm/media/;
        expires 7d;
        add_header Cache-Control "public";
        # Security: prevent execution of uploaded files as scripts
        add_header X-Content-Type-Options "nosniff";
        access_log off;
    }

    # ── Django application — proxy to Gunicorn ────────────────────────────────
    location / {
        proxy_pass http://medburg_gunicorn;

        # Pass real client information to Django
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts — match Gunicorn's worker timeout
        proxy_connect_timeout 30s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        # Buffering — off for streaming responses; on improves throughput for HTML
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers     8 8k;

        # Disable redirect following by proxy (let Django handle it)
        proxy_redirect off;
    }

    # ── Deny hidden files (.env, .git, etc.) ─────────────────────────────────
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Favicon — suppress 404 log noise ─────────────────────────────────────
    location = /favicon.ico {
        alias /var/www/medburg_crm/staticfiles/favicon.ico;
        access_log off;
        log_not_found off;
    }

    # ── robots.txt ────────────────────────────────────────────────────────────
    location = /robots.txt {
        alias /var/www/medburg_crm/staticfiles/robots.txt;
        access_log off;
        log_not_found off;
    }
}
