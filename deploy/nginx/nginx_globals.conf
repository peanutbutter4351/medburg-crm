# ─────────────────────────────────────────────────────────────────────────────
# Medburg / Lordtip VPS — Nginx Global Configuration Snippet
# File: deploy/nginx/nginx_globals.conf
#
# These directives belong in /etc/nginx/nginx.conf (http { } block),
# NOT in the per-site vhost file.
#
# Apply on VPS:
#   1. Review current /etc/nginx/nginx.conf
#   2. Merge these settings into the http { } block
#   3. sudo nginx -t && sudo systemctl reload nginx
#
# These settings are SHARED across both Medburg and Lordtip CRM vhosts.
# ─────────────────────────────────────────────────────────────────────────────

# ── Worker tuning ─────────────────────────────────────────────────────────────
# worker_processes auto;          # one worker per CPU core (Ubuntu default)
# worker_connections 1024;        # max simultaneous connections per worker

# ── Buffer tuning (global defaults) ──────────────────────────────────────────
# Increase from Ubuntu default (4k) to handle Django's larger headers
# (session cookie + CSRF token + custom headers can exceed 4k easily)
client_header_buffer_size    4k;
large_client_header_buffers  4 16k;
client_body_buffer_size      128k;

# ── Timeout tuning ────────────────────────────────────────────────────────────
client_body_timeout    12;
client_header_timeout  12;
send_timeout           10;

# ── Security: hide Nginx version ──────────────────────────────────────────────
# Prevents attackers from targeting known CVEs by version number
server_tokens off;

# ── TCP optimization ──────────────────────────────────────────────────────────
# sendfile: use kernel-space file serving (bypasses user-space copy)
# tcp_nopush: batch packet sends (better throughput for large files)
# tcp_nodelay: disable Nagle's algorithm (better latency for small responses)
sendfile    on;
tcp_nopush  on;
tcp_nodelay on;

# ── Structured access log format ──────────────────────────────────────────────
# Includes:
#   - request_time: total request duration (matches Gunicorn µs log)
#   - upstream_response_time: Gunicorn processing time (excludes Nginx overhead)
#   - request_id: correlate with Django app.log X-Request-ID header
#
# Add this inside the http { } block in nginx.conf:
log_format medburg_main '$remote_addr - $remote_user [$time_local] '
                        '"$request" $status $body_bytes_sent '
                        '"$http_referer" "$http_user_agent" '
                        'rt=$request_time ut="$upstream_response_time" '
                        'rid=$request_id';

# To use this format, change in each vhost:
#   access_log /var/log/nginx/medburg_access.log medburg_main;
#   access_log /var/log/nginx/lordtip_access.log medburg_main;

# ── Gzip (global, applies to all vhosts) ─────────────────────────────────────
# The vhost file also has gzip settings — vhost overrides global.
# These are good global defaults.
gzip              on;
gzip_vary         on;
gzip_proxied      any;
gzip_comp_level   5;
gzip_min_length   256;
gzip_types
    text/plain
    text/css
    text/javascript
    application/json
    application/javascript
    application/xml
    image/svg+xml;
